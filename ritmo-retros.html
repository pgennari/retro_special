<style>

.progress-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}.step-card{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;padding:14px 16px;min-height:74px;display:flex;align-items:center;gap:12px;color:var(--ink)}.step-card:hover{border-color:#b7cce2}.step-card.selected{border-color:#9fc3e7;box-shadow:0 0 0 2px #e6f1fc}.step-num{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:750;flex:0 0 auto}.step-num.green{background:var(--green-soft);color:var(--green)}.step-num.orange{background:var(--orange-soft);color:var(--orange)}.step-num.purple{background:var(--purple-soft);color:var(--purple)}.step-title{display:block;font-weight:700;font-size:14px}.step-caption{display:block;color:var(--muted);font-size:13px;margin-top:1px}.step-arrow{margin-left:auto;color:#9da39c;font-size:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel-head{padding:22px 24px 15px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.panel-head h2{font-size:20px;letter-spacing:-.35px;margin:0 0 5px}.panel-head p{color:var(--muted);margin:0;font-size:14px}.panel-body{padding:0 24px 24px}.section-layout{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:18px}.items-list{display:grid;gap:12px}.entry-card{border:1px solid var(--line);border-radius:12px;padding:17px 18px;background:#fff}.entry-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.entry-card h3{font-size:16px;margin:0;font-weight:700}.entry-detail{color:var(--muted);margin:6px 0 0;font-size:14px}.entry-number{color:#9aa09a;font-size:12px;font-weight:700;white-space:nowrap}.action-box{margin-top:14px;border-radius:10px;background:#f8faf9;border:1px solid #edf0ed;padding:12px 13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.action-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:750;color:#737b73;margin-bottom:3px}.action-text{font-size:14px;font-weight:550}.owner{display:flex;align-items:center;gap:7px;color:#586158;font-size:13px;white-space:nowrap}.owner-dot{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:#e8edf4;color:#475a72;font-size:10px;font-weight:750}.no-action{color:#8b918b;font-size:13px;margin-top:12px}.side-panel{border:1px solid var(--line);background:#fbfcfb;border-radius:12px;padding:17px;height:max-content}.side-panel h3{font-size:15px;margin:0 0 5px}.side-panel p{font-size:13px;color:var(--muted);margin:0 0 14px}.side-stat{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:13px}.side-stat strong{font-size:14px}.empty{border:1px dashed #cfd6cf;border-radius:12px;padding:28px;text-align:center;color:var(--muted);background:# .game-shell{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px}.game-card{border:1px solid #e7e1f0;background:#fff;border-radius:14px;overflow:hidden}.game-banner{padding:22px 24px;background:linear-gradient(110deg,#f4f0fa,#faf8fd);border-bottom:1px solid #e9e3f2}.game-kicker{font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:7px}.game-banner h2{margin:0 0 6px;font-size:21px;letter-spacing:-.4px}.game-banner p{margin:0;color:#6f6877;font-size:14px}.game-content{padding:22px 24px}.phase-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}.phase-chip{font-size:13px;font-weight:650;color:#71687c;background:#f3f0f7;border-radius:999px;padding:5px 10px}.phase-chip.active{color:#5e408d;background:#e8def5}.form-label{font-size:13px;font-weight:700;display:block;margin:0 0 7px}.field{width:100%;border:1px solid #dfe4df;border-radius:9px;background:#fff;padding:11px 12px;color:var(--ink);min-height:44px}.field::placeholder{color:#a1a6a0}.field:focus{border-color:#9ebce0}.field-area{min-height:92px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-group{margin-bottom:14px}.form-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.hint{font-size:13px;color:var(--muted)}.answer-card{border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:10px}.answer-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.answer-tag{font-size:12px;font-weight:700;color:#71687c;background:#f3f0f7;padding:4px 8px;border-radius:999px}.answer-content{font-size:15px}.answer-select{min-height:42px;border:1px solid #dfe4df;border-radius:8px;padding:8px 10px;width:100%;background:white;margin-top:11px}.guess-row{margin-top:11px}.game-side{background:#fbfafe;border:1px solid #e9e3f2;border-radius:12px;padding:18px;height:max-content}.game-side h3{font-size:15px;margin:0 0 7px}.game-side p{font-size:13px;color:#706a76;margin:0 0 14px}.score-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid #e8e2ed}.score-rank{font-size:12px;font-weight:750;color:#8879a0;width:20px}.score-name{font-weight:650;font-size:14px;flex:1}.score-points{font-weight:750;color:var(--purple);font-size:14px}.notice{padding:11px 13px;border:1px solid #eadff5;background:#faf7fd;border-radius:9px;color:#645775;font-size:13px;margin:15px 0}.notice.blue{border-color:#dce8f5;background:#f5f9fd;color:#566d83}.notice.orange{border-color:#f0dfcd;background:#fdf8f2;color:#805d3b}.leader{display:inline-flex;align-items:center;gap:5px;background:#fff6dc;color:#79591b;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:700}
.action-list{display:grid;gap:10px}.action-row{display:grid;grid-template-columns:25px minmax(0,1fr) auto;gap:12px;align-items:start;padding:15px 16px;border:1px solid var(--line);border-radius:11px;background:#fff}.action-check{appearance:none;width:20px;height:20px;border:1.5px solid #bcc7bd;border-radius:6px;margin:1px 0 0;cursor:pointer;display:grid;place-items:center}.action-check:checked{background:#3e9a68;border-color:#3e9a68}.action-check:checked:after{content:'✓';color:#fff;font-size:13px;font-weight:800}.action-row.done .action-main{text-decoration:line-through;color:#929892}.action-title{font-weight:700}.action-meta{color:var(--muted);font-size:13px;margin-top:4px}.action-origin{font-size:12px;color:#657265;background:#f1f4f1;padding:5px 8px;border-radius:7px;white-space:nowrap}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.member-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line)}.member-avatar{height:36px;width:36px;display:grid;place-items:center;border-radius:50%;background:#edf1f5;color:#516278;font-weight:750;font-size:12px}.member-info{flex:1}.member-name{font-weight:650}.member-role{font-size:13px;color:var(--muted)}.member-badge{font-size:12px;color:#697269;background:#f2f4f2;border-radius:999px;padding:5px 9px}.callout{padding:16px;border:1px solid #dce8f5;background:#f6fafe;border-radius:11px;color:#50667e;font-size:14px}.callout strong{display:block;color:#2e4c6b;margin-bottom:4px}.footer-note{color:#8b918b;text-align:center;font-size:12px;margin:30px auto 0;max-width:780px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#252724;color:white;border-radius:9px;padding:11px 16px;font-size:14px;box-shadow:var(--shadow);transition:all .2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:950px){.app{grid-template-columns:minmax(0,1fr)}.sidebar{width:100%;min-width:0;overflow:hidden;padding:14px 18px;gap:14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 3px}.sidebar .nav-label,.side-bottom{display:none}.nav{display:flex;width:100%;min-width:0;max-width:100%;overflow:auto;gap:5px}.nav button{flex:0 0 auto}.main{padding-top:18px}.section-layout,.game-shell{grid-template-columns:1fr}.side-panel,.game-side{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.side-panel h3,.game-side h3{grid-column:1/-1}.side-panel p,.game-side p{grid-column:1/-1}.team-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.main{padding:16px 16px 34px}.topbar{align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}.team-control{width:100%;justify-content:space-between}.team-select{max-width:none;flex:1}.top-actions{width:100%;justify-content:space-between}.page-head{display:block}.head-meta{justify-content:flex-start;margin-top:14px}.progress-strip{grid-template-columns:1fr;gap:8px}.step-card{min-height:64px;padding:11px 13px}.panel-head{padding:18px 17px 13px}.panel-body{padding:0 17px 18px}.section-layout,.game-shell{gap:12px}.side-panel,.game-side{display:block}.entry-card{padding:14px}.action-box{grid-template-columns:1fr}.form-row{grid-template-columns:1fr;gap:0}.game-banner,.game-content{padding:18px}.game-banner h2{font-size:19px}.team-grid{grid-template-columns:1fr}.action-row{grid-template-columns:24px minmax(0,1fr)}.action-origin{grid-column:2;justify-self:start}.avatar-stack{display:none}.panel-head .button{white-space:nowrap}}

<body>
<div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='ritmo-retro-v1';
const seed={currentTeam:'team-1',view:'retro',block:'good',teams:[{id:'team-1',name:'Equipe Horizonte',members:['Ana','Bruno','Caio','Dani'],retro:{title:'Retrospectiva da Sprint 24',sprint:'Sprint 24',period:'20–24 out 2026',good:[{id:'g1',title:'Pair programming nos itens de maior risco',detail:'A colaboração antecipou dúvidas e evitou retrabalho no fim da Sprint.',action:'Manter pareamento nos itens com maior risco técnico.',owner:'Bruno',done:false},{id:'g2',title:'Daily mais curta e objetiva',detail:'O time focou nos impedimentos e terminou dentro do horário.',action:'Continuar usando a daily para desbloquear o trabalho.',owner:'Ana',done:false}],improve:[{id:'i1',title:'Histórias chegaram sem critérios de aceite',detail:'Algumas dúvidas apareceram durante o desenvolvimento.',action:'Adicionar checklist de critérios no refinamento.',owner:'Dani',done:false},{id:'i2',title:'Integração ficou para o último dia',detail:'A validação conjunta concentrou risco perto da entrega.',action:'Integrar e validar incrementos diariamente.',owner:'Caio',done:false}],question:'Qual hábito da equipe mais ajudou a Sprint a fluir?',responses:[],guesses:{},phase:'answers'}}]};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){state=structuredClone(seed)}
const app=document.getElementById('app');let toastTimer;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function team(){return state.teams.find(t=>t.id===state.currentTeam)||state.teams[0]}function retro(){return team().retro}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(n){return n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}function countNotes(){return retro().good.length+retro().improve.length}
function render(){if(!state.teams.length){state=structuredClone(seed)}const t=team(),r=retro();const names=t.members;const memberAvatars=names.slice(0,4).map(n=>`<span class="avatar" title="${esc(n)}">${esc(initials(n))}</span>`).join('');app.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">R</div><div><div class="brandname">Ritmo</div><div class="brandtag">Retros de Sprint</div></div></div><div><div class="nav-label">Workspace</div><nav class="nav" aria-label="Navegação principal"><button data-view="retro" class="${state.view==='retro'?'active':''}"><span class="nav-icon">◷</span>Retrospectiva</button><button data-view="actions" class="${state.view==='actions'?'active':''}"><span class="nav-icon">✓</span>Planos de ação</button><button data-view="team" class="${state.view==='team'?'active':''}"><span class="nav-icon">♧</span>Equipe</button></nav></div><div class="side-bottom"><strong>Um passo de cada vez</strong>Transforme conversas em pequenas melhorias para a próxima Sprint.</div></aside><main class="main"><div class="topbar"><div class="team-control"><label for="teamPicker">Equipe</label><select id="teamPicker" class="team-select">${state.teams.map(x=>`<option value="${esc(x.id)}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="button small" data-action="new-team" aria-label="Criar equipe">+ Equipe</button></div><div class="top-actions"><div class="avatar-stack" aria-label="Participantes">${memberAvatars}</div><span class="tag">${names.length} pessoas</span><button class="button primary" data-action="new-retro">Nova retro</button></div></div><div class="content">${state.view==='retro'?renderRetro(r,t):state.view==='actions'?renderActions(r,t):renderTeam(t)}</div><p class="footer-note">Protótipo local para explorar o fluxo. Os dados ficam salvos neste navegador; convites e sincronização entre dispositivos ainda não estão conectados.</p></main></div>`;bind()}
function renderRetro(r,t){let total=countNotes(),active=state.block;return `<p class="eyebrow">${esc(r.sprint)} <span aria-hidden="true">·</span> ${esc(r.period)}</p><div class="page-head"><div><h1>${esc(r.title)}</h1><p class="subtitle">Um espaço para celebrar o que funcionou e transformar aprendizados em próximos passos.</p></div><div class="head-meta"><span class="tag blue">● Em andamento</span><span class="tag">${total} contribuições</span></div></div><div class="progress-strip"><button class="step-card ${active==='good'?'selected':''}" data-block="good"><span class="step-num green">01</span><span><span class="step-title">O que deu certo</span><span class="step-caption">${r.good.length} contribuições</span></span><span class="step-arrow">›</span></button><button class="step-card ${active==='improve'?'selected':''}" data-block="improve"><span class="step-num orange">02</span><span><span class="step-title">O que melhorar</span><span class="step-caption">${r.improve.length} contribuições</span></span><span class="step-arrow">›</span></button><button class="step-card ${active==='game'?'selected':''}" data-block="game"><span class="step-num purple">03</span><span><span class="step-title">Dinâmica secreta</span><span class="step-caption">${phaseLabel(r)}</span></span><span class="step-arrow">›</span></button></div>${active==='game'?renderGame(r,t):renderNotes(r,t,active)}`}
function phaseLabel(r){return r.phase==='answers'?'Respostas anônimas':r.phase==='guessing'?'Palpites em andamento':'Placar revelado'}
function renderNotes(r,t,kind){const good=kind==='good',list=good?r.good:r.improve;const color=good?'green':'orange';const heading=good?'O que deu certo na última Sprint':'O que podemos melhorar';const help=good?'Registre práticas, decisões ou momentos que ajudaram a equipe.':'Traga oportunidades de melhoria com foco no processo, não em culpados.';const items=list.length?list.map((x,i)=>`<article class="entry-card"><div class="entry-top"><div><h3>${esc(x.title)}</h3>${x.detail?`<p class="entry-detail">${esc(x.detail)}</p>`:''}</div><span class="entry-number">#${String(i+1).padStart(2,'0')}</span></div>${x.action?`<div class="action-box"><div><div class="action-label">Plano de ação</div><div class="action-text">${esc(x.action)}</div></div><div class="owner"><span class="owner-dot">${esc(initials(x.owner||'?'))}</span>${esc(x.owner||'Sem responsável')}</div></div>`:`<div class="no-action">Sem plano de ação ou responsável ainda.</div>`}</article>`).join(''):`<div class="empty"><strong>Ainda sem contribuições</strong>Comece registrando uma observação desta Sprint.</div>`;return `<section class="panel"><div class="panel-head"><div><h2>${heading}</h2><p>${help}</p></div><span class="tag ${color}">${list.length} itens</span></div><div class="panel-body"><div class="section-layout"><div class="items-list">${items}<button class="add-row ${good?'':'orange'}" data-action="add-note" data-kind="${kind}">＋ Adicionar contribuição</button></div><aside class="side-panel"><h3>O foco da conversa</h3><p>${good?'Identificar o que vale a pena repetir e fortalecer.':'Escolher mudanças pequenas que a equipe consiga experimentar.'}</p><div class="side-stat"><span>Itens registrados</span><strong>${list.length}</strong></div><div class="side-stat"><span>Com plano de ação</span><strong>${list.filter(x=>x.action).length}</strong></div><div class="side-stat"><span>Com responsável</span><strong>${list.filter(x=>x.owner).length}</strong></div></aside></div></div></section>`}
function renderGame(r,t){const participants=t.members;let current=state.activeParticipant||participants[0]||'';let responses=r.responses||[];const scores=scoreboard(r,t);let phase=r.phase||'answers';let phaseTitle=phase==='answers'?'Respostas secretas':phase==='guessing'?'Quem escreveu?':'Placar da dinâmica';let body='';if(phase==='answers'){const submitted=responses.some(x=>x.author===current);body=`<div class="notice">As respostas ficam sem nome para os demais participantes. O sistema revela a autoria só depois dos palpites.</div><div class="form-row"><div class="field-group"><label class="form-label" for="currentParticipant">Participando como</label><select id="currentParticipant" class="field">${participants.map(n=>`<option value="${esc(n)}" ${n===current?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field-group"><label class="form-label" for="dynamicQuestion">Pergunta criada pela PM</label><input id="dynamicQuestion" class="field" value="${esc(r.question)}" ${responses.length?'readonly':''} aria-label="Pergunta da dinâmica"></div></div>${submitted?`<div class="empty"><strong>Resposta registrada!</strong>Ela está guardada em segredo. Aguarde o início dos palpites.</div>`:`<div class="field-group"><label class="form-label" for="answerText">Sua resposta</label><textarea id="answerText" class="field field-area" placeholder="Escreva sua resposta sem se identificar..."></textarea></div><div class="form-footer"><span class="hint">A autoria não será mostrada durante os palpites.</span><button class="button primary" data-action="submit-answer">Enviar resposta secreta</button></div>`}<div class="form-footer" style="margin-top:22px;border-top:1px solid var(--line);padding-top:16px"><span class="hint">${responses.length} de ${participants.length} respostas enviadas</span><button class="button small" data-action="start-guessing" ${responses.length<2?'disabled':''}>Iniciar palpites →</button></div>`}else if(phase==='guessing'){body=`<div class="form-row"><div class="field-group"><label class="form-label" for="currentParticipant">Participando como</label><select id="currentParticipant" class="field">${participants.map(n=>`<option value="${esc(n)}" ${n===current?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field-group"><label class="form-label">Pergunta da rodada</label><div class="field" style="background:#fbfafc">${esc(r.question)}</div></div></div><div class="notice">Um palpite por resposta. Você não pode palpitar na sua própria resposta nem repetir a mesma pessoa como autora. Para liberar alguém, limpe o palpite original antes de registrar.</div><div id="guessList">${responses.map((x,i)=>{let own=x.author===current;let prev=(r.guesses?.[current]||{})[x.id];return `<article class="answer-card"><div class="answer-top"><span class="answer-tag">Resposta ${i+1}</span>${own?'<span class="tag">Sua resposta</span>':''}</div><div class="answer-content">${esc(x.text)}</div>${own?'<div class="guess-row hint">Você não pode palpitar na própria resposta.</div>':prev?`<div class="guess-row hint">Palpite registrado: <strong>${esc(prev)}</strong></div>`:`<div class="guess-row"><label class="form-label" for="guess-${esc(x.id)}">Quem escreveu?</label><select class="answer-select guess-select" data-answer="${esc(x.id)}" id="guess-${esc(x.id)}"><option value="">— Limpar palpite / escolher pessoa —</option>${participants.filter(n=>n!==current).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div>`}</article>`}).join('')}</div><div class="form-footer"><span class="hint">Palpites já feitos ficam bloqueados para você.</span><button class="button primary" data-action="submit-guesses">Registrar meus palpites</button></div><div class="form-footer" style="border-top:1px solid var(--line);padding-top:15px;margin-top:17px"><span class="hint">Cada pessoa envia seus próprios palpites.</span><button class="button small" data-action="reveal-score">Revelar placar</button></div>`}else{body=`<div class="notice">Autoria revelada. Cada acerto vale um ponto; autores não recebem pontos por respostas não adivinhadas.</div>${responses.map((x,i)=>`<article class="answer-card"><div class="answer-top"><span class="answer-tag">Resposta ${i+1}</span><span class="tag purple">${esc(x.author)}</span></div><div class="answer-content">${esc(x.text)}</div><div class="guess-row hint">${Object.entries(r.guesses||{}).filter(([who,g])=>g[x.id]).map(([who,g])=>`${esc(who)}: ${g[x.id]===x.author?'acertou':'errou'}`).join(' · ')||'Ninguém arriscou um palpite.'}</div></article>`).join('')||'<div class="empty"><strong>Nenhuma resposta nesta rodada</strong>Volte à etapa de respostas para começar a dinâmica.</div>'}<div class="form-footer"><span class="hint">O placar considera apenas palpites corretos.</span><button class="button small" data-action="reset-game">Nova rodada</button></div>`}
return `<section class="game-shell"><div class="game-card"><div class="game-banner"><div class="game-kicker">Dinâmica exclusiva da equipe</div><h2>${phaseTitle}</h2><p>Uma pergunta, respostas em segredo e palpites para descobrir quem escreveu.</p></div><div class="game-content"><div class="phase-row"><span class="phase-chip ${phase==='answers'?'active':''}">1. Responder</span><span aria-hidden="true">›</span><span class="phase-chip ${phase==='guessing'?'active':''}">2. Adivinhar</span><span aria-hidden="true">›</span><span class="phase-chip ${phase==='revealed'?'active':''}">3. Placar</span></div>${body}</div></div><aside class="game-side"><h3>Placar da equipe</h3><p>${phase==='revealed'?'Resultado desta rodada.':'Os pontos aparecem depois que a autoria for revelada.'}</p>${phase==='revealed'?scores.map((s,i)=>`<div class="score-row"><span class="score-rank">${i===0?'🏆':String(i+1).padStart(2,'0')}</span><span class="score-name">${esc(s.name)}</span><span class="score-points">${s.points} ${s.points===1?'pt':'pts'}</span></div>`).join(''):`<div class="score-row"><span class="score-rank">—</span><span class="score-name">Pontuação oculta</span><span class="score-points">•••</span></div>`}<div class="notice">Regra: uma pessoa só pode ser escolhida como autora uma vez. Limpe o palpite original antes de registrar para liberar.</div>${phase==='answers'?`<button class="button small" data-action="edit-question">Editar pergunta</button>`:''}</aside></section>`}
function scoreboard(r,t){const scores=t.members.map(name=>({name,points:0}));for(const [guesser,guesses] of Object.entries(r.guesses||{})){for(const response of r.responses||[]){if(guesses[response.id]===response.author){const s=scores.find(x=>x.name===guesser);if(s)s.points++}}}return scores.sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name))}
function renderActions(r,t){const all=[...r.good.map(x=>({...x,kind:'Deu certo'})),...r.improve.map(x=>({...x,kind:'Melhorar'}))];return `<p class="eyebrow">${esc(t.name)} <span aria-hidden="true">·</span> ${esc(r.sprint)}</p><div class="page-head"><div><h1>Planos de ação</h1><p class="subtitle">Acompanhe os combinados da retro e retome-os na próxima Sprint.</p></div><span class="tag">${all.filter(x=>x.action).length} ações</span></div><section class="panel"><div class="panel-head"><div><h2>Combinados da equipe</h2><p>Marque como concluído quando a ação for realizada.</p></div></div><div class="panel-body"><div class="action-list">${all.filter(x=>x.action).map(x=>`<label class="action-row ${x.done?'done':''}"><input type="checkbox" class="action-check" data-toggle-action="${esc(x.id)}" ${x.done?'checked':''}><span class="action-main"><span class="action-title">${esc(x.action)}</span><span class="action-meta">Responsável: ${esc(x.owner||'não definido')} · ${esc(x.title)}</span></span><span class="action-origin">${esc(x.kind)}</span></label>`).join('')||'<div class="empty"><strong>Nenhuma ação cadastrada</strong>Adicione planos de ação nos itens da retrospectiva.</div>'}</div></div></section>`}
function renderTeam(t){return `<p class="eyebrow">Workspace <span aria-hidden="true">·</span> Equipes</p><div class="page-head"><div><h1>${esc(t.name)}</h1><p class="subtitle">Gerencie as pessoas que participam das retrospectivas desta equipe.</p></div><button class="button primary" data-action="add-member">+ Adicionar pessoa</button></div><div class="team-grid"><section class="panel"><div class="panel-head"><div><h2>Participantes</h2><p>${t.members.length} pessoas nesta equipe</p></div></div><div class="panel-body">${t.members.map((n,i)=>`<div class="member-row"><div class="member-avatar">${esc(initials(n))}</div><div class="member-info"><div class="member-name">${esc(n)}</div><div class="member-role">${i===0?'Facilitador(a)':'Participante'}</div></div>${i===0?'<span class="member-badge">PM</span>':''}</div>`).join('')||'<div class="empty">Nenhuma pessoa adicionada.</div>'}</div></section><aside class="callout"><strong>Sobre este protótipo</strong>Este arquivo demonstra o fluxo da retrospectiva e salva os dados apenas neste navegador. Para equipes diferentes colaborarem de verdade, será preciso adicionar login, banco compartilhado e links de convite.<br><br>Por enquanto, use o seletor “Participando como” na dinâmica para experimentar os papéis de cada pessoa.</aside></div>`}
function syncGuessOptions(){const current=document.getElementById('currentParticipant')?.value;const prior=Object.values(retro().guesses?.[current]||{});const selects=[...app.querySelectorAll('.guess-select')];selects.forEach(select=>{[...select.options].forEach(option=>{if(!option.value)return;option.disabled=prior.includes(option.value)||selects.some(other=>other!==select&&other.value===option.value)});});}
function bind(){app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();render()});app.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{state.block=b.dataset.block;save();render()});const picker=document.getElementById('teamPicker');picker.onchange=()=>{state.currentTeam=picker.value;state.activeParticipant=null;state.view='retro';state.block='good';save();render()};const participantPicker=document.getElementById('currentParticipant');if(participantPicker)participantPicker.onchange=()=>{state.activeParticipant=participantPicker.value;save();render()};const guessSelects=app.querySelectorAll('.guess-select');guessSelects.forEach(select=>select.onchange=syncGuessOptions);syncGuessOptions();app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action,b));app.querySelectorAll('[data-toggle-action]').forEach(box=>box.onchange=()=>{let id=box.dataset.toggleAction;let x=[...retro().good,...retro().improve].find(v=>v.id===id);if(x){x.done=box.checked;save();render()}})}
function handleAction(action,el){const r=retro(),t=team();if(action==='add-note'){const kind=el.dataset.kind;const title=prompt('O que você quer registrar?');if(!title?.trim())return;const detail=prompt('Contexto ou exemplo (opcional):')||'';const plan=prompt('Plano de ação (opcional):')||'';const owner=plan?prompt(`Responsável? (${t.members.join(', ')})`)||'':'';const entry={id:'n'+Date.now(),title:title.trim(),detail:detail.trim(),action:plan.trim(),owner:owner.trim(),done:false};r[kind].push(entry);save();render();toast('Contribuição adicionada.')}else if(action==='new-team'){const name=prompt('Nome da nova equipe:');if(!name?.trim())return;const id='team-'+Date.now();state.teams.push({id,name:name.trim(),members:[],retro:{title:'Retrospectiva da Sprint 1',sprint:'Sprint 1',period:'Nova rodada',good:[],improve:[],question:'Qual foi um momento marcante da Sprint?',responses:[],guesses:{},phase:'answers'}});state.currentTeam=id;state.view='team';save();render();toast('Equipe criada neste navegador.')}else if(action==='new-retro'){if(!confirm('Iniciar uma nova retrospectiva? Os itens da retro atual serão substituídos.'))return;const sprint=prompt('Nome da Sprint:','Sprint seguinte');if(!sprint?.trim())return;const question=prompt('Pergunta da dinâmica secreta:',r.question)||r.question;t.retro={title:`Retrospectiva da ${sprint.trim()}`,sprint:sprint.trim(),period:new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).format(new Date()),good:[],improve:[],question,responses:[],guesses:{},phase:'answers'};state.view='retro';state.block='good';save();render();toast('Nova retrospectiva criada.')}else if(action==='submit-answer'){const who=document.getElementById('currentParticipant').value;const text=document.getElementById('answerText').value.trim();if(!text){toast('Escreva sua resposta antes de enviar.');return}if(r.responses.some(x=>x.author===who)){toast('Esta pessoa já enviou uma resposta.');return}r.responses.push({id:'a'+Date.now()+Math.random().toString(16).slice(2,5),author:who,text});save();render();toast('Resposta enviada em segredo.')}else if(action==='start-guessing'){if(r.responses.length<2){toast('São necessárias pelo menos duas respostas para iniciar.');return}r.phase='guessing';save();render();toast('Fase de palpites iniciada.')}else if(action==='submit-guesses'){const who=document.getElementById('currentParticipant').value;r.guesses=r.guesses||{};r.guesses[who]=r.guesses[who]||{};const selects=[...document.querySelectorAll('.guess-select')];if(selects.some(s=>!s.value)){toast('Escolha um autor para cada resposta disponível.');return}const currentPicks=selects.map(s=>s.value);const lockedPicks=Object.values(r.guesses[who]||{});if(new Set([...lockedPicks,...currentPicks]).size!==lockedPicks.length+currentPicks.length){toast('Cada pessoa só pode ser escolhida como autora em uma resposta. Limpe o palpite anterior para liberar.');return}selects.forEach(s=>{r.guesses[who][s.dataset.answer]=s.value});save();render();toast('Palpites registrados.')}else if(action==='reveal-score'){if(!confirm('Revelar a autoria e o placar para toda a equipe?'))return;r.phase='revealed';save();render();toast('Placar revelado.')}else if(action==='reset-game'){if(!confirm('Apagar as respostas e iniciar uma nova rodada?'))return;r.responses=[];r.guesses={};r.phase='answers';save();render();toast('Nova rodada pronta.')}else if(action==='edit-question'){const q=prompt('Pergunta criada pela PM:',r.question);if(q?.trim()){r.question=q.trim();save();render();toast('Pergunta atualizada.')}}else if(action==='add-member'){const name=prompt('Nome da pessoa:');if(!name?.trim())return;if(t.members.some(n=>n.toLowerCase()===name.trim().toLowerCase())){toast('Essa pessoa já está na equipe.');return}t.members.push(name.trim());save();render();toast('Pessoa adicionada.')}}
render();
</script>
</body>
</html>
